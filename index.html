<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEG Productivity</title>
<style>
:root{
  --bg:#e9efff; --panel:rgba(255,255,255,.62); --line:rgba(15,23,42,.12); --ink:#0f172a; --ink-soft:#475569;
  --chip:rgba(255,255,255,.6); --chip-line:rgba(15,23,42,.14); --acc:#6366f1; --on-acc:#fff; --pop:#fff; --hi:rgba(255,255,255,.9);
  --good:#047857; --bad:#be123c; --warn:#b45309; --m:#b45309; --n:#1d4ed8; --on:#6d28d9;
  --back:radial-gradient(circle at 10% 15%,rgba(99,102,241,.28),transparent 42%),radial-gradient(circle at 90% 80%,rgba(244,114,182,.3),transparent 46%),linear-gradient(135deg,#dbeafe,#e0f2fe);
}
[data-theme="dark"]{
  --bg:#1b1147; --panel:rgba(255,255,255,.12); --line:rgba(255,255,255,.25); --ink:#fff; --ink-soft:rgba(255,255,255,.75);
  --chip:rgba(255,255,255,.08); --chip-line:rgba(255,255,255,.22); --acc:#67e8f9; --on-acc:#06222b; --pop:#26305a; --hi:rgba(255,255,255,.25);
  --good:#6ee7b7; --bad:#fda4af; --warn:#fcd34d; --m:#fde047; --n:#67e8f9; --on:#f9a8d4;
  --back:radial-gradient(circle at 12% 18%,rgba(255,64,200,.38),transparent 42%),radial-gradient(circle at 88% 72%,rgba(0,200,255,.38),transparent 46%),linear-gradient(135deg,#1b1147,#0b3b5c);
}
*{box-sizing:border-box}
body{margin:0;background:var(--back);background-attachment:fixed;background-color:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;min-height:100vh}
.header,.tabs,.panel,.stat,.ss-pop{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.header{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{margin:0;font-size:18px}
.header .meta{font-size:11px;color:var(--ink-soft)}
.btn{border:1px solid var(--chip-line);border-radius:16px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn.dark{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn:active{transform:scale(.96)}
.chip-user{font-size:11px;padding:6px 12px;border-radius:14px;border:1px solid var(--chip-line);background:var(--chip)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--chip-line);background:var(--chip);border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-soft)}
.tab.active,.pill.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 40px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);border-radius:12px;margin-bottom:14px}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.panel-head h3{margin:0;font-size:14px}
.panel-body{padding:14px 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input{padding:6px 10px;border-radius:8px;border:1px solid var(--chip-line);font-size:12px;background:var(--chip);color:var(--ink)}
select option{background:var(--pop);color:var(--ink)}
.filters label{font-size:11px;font-weight:700;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:var(--pop);text-align:left;padding:7px 8px;color:var(--ink-soft);font-size:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:var(--chip)}
tr.special td{font-style:italic;background:rgba(251,191,36,.14)}
tr.total td{font-weight:800;background:var(--chip);border-top:2px solid var(--line)}
.table-wrap{overflow:auto;max-height:520px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-align:center;min-width:80px}
.stat b{display:block;font-size:18px;color:var(--acc)}
.stat span{font-size:9.5px;color:var(--ink-soft);font-weight:700}
.pill{background:var(--chip);border:1px solid var(--chip-line);border-radius:14px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.badge{background:var(--chip);border:1px solid var(--chip-line);border-radius:8px;padding:2px 8px;font-size:10px;font-weight:700}
.pass{color:var(--good);font-weight:700}
.diffbad{color:var(--bad);font-weight:700}
.loading{padding:30px;text-align:center;color:var(--ink-soft)}
.err{padding:14px;background:rgba(244,63,94,.16);color:var(--bad);border-radius:8px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.err button{margin-top:8px;border:none;background:var(--bad);color:#000;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--chip);border:1px solid var(--chip-line);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.tag button{border:none;background:none;cursor:pointer;color:var(--bad);font-weight:800}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{border:1px solid var(--chip-line);border-radius:10px;padding:10px 12px;background:var(--chip)}
.card b{font-family:monospace}
.rank{font-weight:800;width:22px;display:inline-block}
.totals{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.totals{grid-template-columns:1fr}}
.tt th,.tt td{text-align:center}
.sh-M{color:var(--m);font-weight:800}.sh-N{color:var(--n);font-weight:800}.sh-ON{color:var(--on);font-weight:800}
.acc-v{color:var(--acc);font-weight:800}
.ss{position:relative;display:inline-block}
.ss-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--chip-line);font-size:12px;background:var(--chip);color:var(--ink);cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-pop{display:none;position:absolute;top:34px;left:0;z-index:30;width:230px;background:var(--pop);border:1px solid var(--acc);border-radius:10px;padding:6px}
.ss-pop input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);margin-bottom:4px;font-size:12px}
.ss-list{max-height:240px;overflow:auto}
.ss-list div{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.ss-list div:hover,.ss-list div.on{background:var(--chip-line)}
.ss-list .none{color:var(--ink-soft);cursor:default}
#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--back);background-color:var(--bg);padding:20px;text-align:center}
#gate.hide{display:none}
#gateMsg{white-space:pre-wrap;margin-top:8px;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="gate"><div class="panel" style="padding:24px 30px;max-width:440px"><h2 style="margin:0">⚡ MEEG Productivity</h2><div id="gateMsg">⏳ Checking access…</div></div></div>

<div class="header">
  <div><h1>⚡ MEEG Productivity</h1><div class="meta">Unified Dashboard — <span id="updTime">—</span></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="userChip" class="chip-user"></span>
    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    <button class="btn dark" onclick="refreshAll()">🔄 Refresh</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="live">📊 Live</button>
  <button class="tab" data-tab="qc">🎯 QC Quality</button>
  <button class="tab" data-tab="teamsq">👥 Teams Quality</button>
  <button class="tab" data-tab="fast">⚡ Fast Submits</button>
  <button class="tab" data-tab="teams">📋 Teams Submission</button>
</div>

<div class="wrap">
  <div id="view-live" class="view"></div>
  <div id="view-qc" class="view" style="display:none"></div>
  <div id="view-teamsq" class="view" style="display:none"></div>
  <div id="view-fast" class="view" style="display:none"></div>
  <div id="view-teams" class="view" style="display:none"></div>
</div>

<script>
// ---------- theme ----------
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
  try { localStorage.setItem('meeg_theme', t); } catch(e){}
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem('meeg_theme') || 'dark'; } catch(e){}
  applyTheme(saved);
})();

// ---------- helpers ----------
function esc(s){ return String(s===undefined||s===null?'':s); }
function fmtPct(v){ return (v===''||v===null||v===undefined||isNaN(v)) ? '-' : (Number(v)<=1 ? (Number(v)*100).toFixed(1)+'%' : Number(v).toFixed(1)); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function errBox(msg, retryFn){
  return `<div class="err">⚠️ ${esc(msg)}<br><button onclick="(${retryFn})()">🔁 Retry</button></div>`;
}

// ---------- shared helpers: shift / search dropdown / totals ----------
function normShift(s){
  const v = String(s||'').trim().toLowerCase();
  if(!v) return '—';
  if(/over\s*night|\(on\)|^on$/.test(v)) return 'ON';
  if(/morning|\(m\)|^m$/.test(v)) return 'M';
  if(/night|\(n\)|^n$/.test(v)) return 'N';
  return String(s).trim();
}
function groupCountFn(rows, fn){ const m={}; rows.forEach(r=>{ const k=fn(r)||'—'; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function closeSS(){ document.querySelectorAll('.ss-pop').forEach(p=>p.style.display='none'); }
document.addEventListener('click', closeSS);
function makeSearchable(sel){
  if(!sel || sel.dataset.ss) return; sel.dataset.ss='1'; sel.style.display='none';
  const wrap=document.createElement('span'); wrap.className='ss';
  const btn=document.createElement('button'); btn.type='button'; btn.className='ss-btn';
  const pop=document.createElement('div'); pop.className='ss-pop';
  const inp=document.createElement('input'); inp.placeholder='🔎 Search…';
  const list=document.createElement('div'); list.className='ss-list';
  pop.append(inp, list); wrap.append(btn, pop); sel.after(wrap);
  const label=()=>{ const o=sel.options[sel.selectedIndex]; btn.textContent=(o?o.text:'')+' ▾'; };
  const pick=o=>{ sel.value=o.value; label(); pop.style.display='none'; if(sel.onchange) sel.onchange(); };
  const draw=()=>{
    const q=inp.value.trim().toLowerCase(); list.innerHTML='';
    const m=[...sel.options].filter(o=>o.text.toLowerCase().includes(q)).slice(0,300);
    m.forEach(o=>{ const d=document.createElement('div'); d.textContent=o.text; if(o.value===sel.value) d.className='on'; d.onclick=e=>{ e.stopPropagation(); pick(o); }; list.appendChild(d); });
    if(!m.length){ const d=document.createElement('div'); d.className='none'; d.textContent='No match'; list.appendChild(d); }
    list._first=m[0];
  };
  btn.onclick=e=>{ e.stopPropagation(); const open=pop.style.display==='block'; closeSS(); if(!open){ pop.style.display='block'; inp.value=''; draw(); inp.focus(); } };
  inp.oninput=draw; inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{ if(e.key==='Enter' && list._first) pick(list._first); if(e.key==='Escape') closeSS(); };
  label();
}
function wavg(rows, key){
  let s=0, w=0;
  rows.forEach(r=>{ const v=r[key]; if(v!=='' && v!==null && v!==undefined && !isNaN(v)){ const t=r.tasks||1; s+=Number(v)*t; w+=t; } });
  return w ? s/w : '';
}
function weekLabel(w){
  if(!w) return '—';
  const s=String(w);
  if(!/^\d{4}-\d{2}-\d{2}/.test(s) && !/^[A-Za-z]{3} [A-Za-z]{3} \d{1,2} \d{4}/.test(s)) return s;
  const d=new Date(s.length===10 ? s+'T00:00:00' : s);
  return isNaN(d) ? s : 'Week of '+d.getDate()+' '+d.toLocaleString('en',{month:'short'});
}
function uniqVals(rows,k){ return [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort(); }
function qfBar(id, rows, st, withLab){
  const opt=a=>a.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  return `<div class="filters" id="${id}"><label>⏱ Shift:</label>${['M','N','ON'].map(s=>`<button class="pill ${st.shift===s?'on':''}" data-s="${s}">${s}</button>`).join('')}
    <select data-k="qtc"><option value="">🔖 All QC</option>${opt(uniqVals(rows,'qtc'))}</select>
    ${withLab?`<select data-k="labeler"><option value="">👤 All Labelers</option>${opt(uniqVals(rows,'labeler'))}</select>`:''}
    <button class="pill" data-clear="1">✕ Clear</button></div>`;
}
function wireQf(id, st, apply, rerender){
  const bar=document.getElementById(id);
  bar.querySelectorAll('select').forEach(s=>{ s.value=st[s.dataset.k]||''; s.onchange=()=>{ st[s.dataset.k]=s.value; apply(); }; makeSearchable(s); });
  bar.querySelectorAll('.pill[data-s]').forEach(p=>p.onclick=()=>{ st.shift = st.shift===p.dataset.s ? '' : p.dataset.s; bar.querySelectorAll('.pill[data-s]').forEach(x=>x.classList.toggle('on', x.dataset.s===st.shift)); apply(); });
  bar.querySelector('[data-clear]').onclick=()=>{ st.shift=''; st.qtc=''; st.labeler=''; rerender(); };
}
// Totals: جدول Shift جنب جدول Workforce (متوسطات بوزن عدد التاسكات)
function totalsHtml(rows, tva){
  const mets = tva ? [['artifacts','ARTIFACTS'],['attribute','ATTRIBUTE'],['tva','TVA F1'],['totalAccuracy','TOTAL ACCURACY']]
                   : [['artifacts','ARTIFACTS'],['attribute','ATTRIBUTE'],['totalAccuracy','TOTAL ACCURACY']];
  const order = {M:1,N:2,ON:3};
  const by = {}, wk = {};
  rows.forEach(r=>{
    const w=r.week||'—', s=normShift(r.shift);
    (by[w+'||'+s] = by[w+'||'+s] || {w, s, rows:[]}).rows.push(r);
    (wk[w] = wk[w] || {w, rows:[]}).rows.push(r);
  });
  const tasks = a => a.reduce((s,r)=>s+(r.tasks||0),0);
  const cell = (a,k,cls)=>`<td class="${cls||''}">${fmtPct(wavg(a,k))}</td>`;
  const shiftRows = Object.values(by).sort((a,b)=>String(a.w).localeCompare(String(b.w)) || ((order[a.s]||9)-(order[b.s]||9))).map(g=>
    `<tr><td>${esc(weekLabel(g.w))}</td><td class="sh-${g.s}">${esc(g.s)}</td><td><b>${tasks(g.rows)}</b></td>${mets.map(([k])=>cell(g.rows,k,k==='totalAccuracy'?'sh-'+g.s:'')).join('')}</tr>`).join('');
  const wfRows = Object.values(wk).sort((a,b)=>String(a.w).localeCompare(String(b.w))).map(g=>
    `<tr><td>${esc(weekLabel(g.w))}</td><td><b>${tasks(g.rows)}</b></td>${mets.map(([k])=>cell(g.rows,k,k==='totalAccuracy'?'acc-v':'')).join('')}</tr>`).join('');
  const head = mets.map(([,l])=>`<th>${l}</th>`).join('');
  return `<div class="totals">
    <div class="panel"><div class="panel-head"><h3>📊 Shift</h3></div><div class="panel-body table-wrap"><table class="tt"><thead><tr><th>WEEK</th><th>SHIFT</th><th>NO. TASKS</th>${head}</tr></thead><tbody>${shiftRows||'<tr><td colspan="9">No data</td></tr>'}</tbody></table></div></div>
    <div class="panel"><div class="panel-head"><h3>👥 Workforce</h3></div><div class="panel-body table-wrap"><table class="tt"><thead><tr><th>WEEK</th><th>TOTAL NO. TASKS</th>${head}</tr></thead><tbody>${wfRows||'<tr><td colspan="8">No data</td></tr>'}</tbody></table></div></div></div>`;
}

// ---------- tabs ----------
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===btn));
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  document.getElementById('view-'+btn.dataset.tab).style.display='block';
  loadTab(btn.dataset.tab);
});
const loaded = {};
function loadTab(tab){
  if(loaded[tab]) return;
  loaded[tab] = true;
  if(tab==='live') loadLive();
  if(tab==='qc') loadQC();
  if(tab==='teamsq') loadTeamsQ();
  if(tab==='fast') renderFastForm();
  if(tab==='teams') renderTeamsForm();
}
function refreshAll(){ Object.keys(loaded).forEach(k=>loaded[k]=false); loadTab(currentTab()); }
function currentTab(){ return document.querySelector('.tab.active').dataset.tab; }

// ============================================================
//  LIVE TAB
// ============================================================
let liveData = null;
let liveState = { shifts:new Set(), modalities:new Set(), passes:new Set(), tab:'all', search:'', filters:{ date:'', qtc:'', labeler:'', device:'', queue:'' } };

function loadLive(){
  document.getElementById('view-live').innerHTML = '<div class="loading">⏳ Loading live data…</div>';
  google.script.run
    .withFailureHandler(e=>{ document.getElementById('view-live').innerHTML = errBox('Failed to load: '+e.message, 'loadLive'); })
    .withSuccessHandler(res=>{
      if(res.error){ document.getElementById('view-live').innerHTML = errBox(res.error, 'loadLive'); return; }
      liveData = res;
      document.getElementById('updTime').textContent = res.lastUpdated;
      renderLiveShell();
    }).getDashboardData();
}

function renderLiveShell(){
  const el = document.getElementById('view-live');
  const opt = (arr) => (arr||[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  const roomTabs = (liveData.locations||[]).map(loc => `<button class="tab" data-room="${esc(loc)}">📍 ${esc(loc)}</button>`).join('');

  el.innerHTML = `
    <div class="panel"><div class="panel-body">
      <input id="globalSearch" placeholder="🔎 Search anything… (name, email, task id, device…)"
        style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--chip-line);margin-bottom:12px;background:var(--chip);color:var(--ink);font-size:13px">
      <div class="filters" id="shiftChips"></div>
      <div class="filters" id="modalityChips"></div>
      <div class="filters" id="passChips"></div>
      <div class="filters">
        <select id="fDate"><option value="">📅 All Dates</option>${opt(liveData.slicerOptions['_dates'])}</select>
        <select id="fQtc"><option value="">🔖 All QTC</option>${opt(liveData.slicerOptions['Qtc Name'])}</select>
        <select id="fLabeler"><option value="">👤 All Labelers</option>${opt(liveData.slicerOptions['Labeler Name'])}</select>
        <select id="fDevice"><option value="">🖥️ All Devices</option>${opt(liveData.slicerOptions['Pc No'])}</select>
        <select id="fQueue"><option value="">📁 All Queues</option>${opt(liveData.slicerOptions['Queue Name'])}</select>
        <button class="pill" onclick="clearLiveFilters()">✕ Clear All</button>
      </div>
      <div class="tagbar" id="activeTags"></div>
    </div></div>

    <div class="tabs" id="roomTabs" style="border-radius:12px;border:1px solid var(--line);margin-bottom:14px">
      <button class="tab active" data-room="all">🌐 All</button>
      <button class="tab" data-room="__total__">📊 Total Submit</button>
      <button class="tab" data-room="__top__">🏆 Top Performers</button>
      ${roomTabs}
    </div>

    <div id="liveBody"></div>`;

  document.getElementById('shiftChips').innerHTML = '<label style="align-self:center">⏱ Shift:</label>' +
    (liveData.slicerOptions['Shift']||[]).map(s=>`<span class="pill ${liveState.shifts.has(s)?'on':''}" data-shift="${esc(s)}">${esc(s)}</span>`).join('');
  document.getElementById('modalityChips').innerHTML = '<label style="align-self:center">🔬 Modality:</label>' +
    (liveData.slicerOptions['Modality']||[]).map(s=>`<span class="pill ${liveState.modalities.has(s)?'on':''}" data-modality="${esc(s)}">${esc(s)}</span>`).join('');
  document.getElementById('passChips').innerHTML = '<label style="align-self:center">✅ Pass:</label>' +
    (liveData.slicerOptions['Pass']||[]).map(s=>`<span class="pill ${liveState.passes.has(s)?'on':''}" data-pass="${esc(s)}">${esc(s)}</span>`).join('');

  const fm = { fDate:'date', fQtc:'qtc', fLabeler:'labeler', fDevice:'device', fQueue:'queue' };
  Object.entries(fm).forEach(([id,k])=>{ const s=document.getElementById(id); s.value=liveState.filters[k]||''; s.onchange=onLiveFilterChange; });
  ['fQtc','fLabeler','fDevice','fQueue'].forEach(id=>makeSearchable(document.getElementById(id)));
  const searchDebounced = debounce(()=>{ liveState.search = document.getElementById('globalSearch').value.toLowerCase(); renderLiveBody(); }, 250);
  document.getElementById('globalSearch').value = liveState.search;
  document.getElementById('globalSearch').oninput = searchDebounced;

  document.getElementById('shiftChips').addEventListener('click', e=>{
    const p = e.target.closest('.pill'); if(!p) return;
    const v = p.dataset.shift;
    if(liveState.shifts.has(v)) liveState.shifts.delete(v); else liveState.shifts.add(v);
    p.classList.toggle('on');
    renderLiveBody();
  });
  document.getElementById('modalityChips').addEventListener('click', e=>{
    const p = e.target.closest('.pill'); if(!p) return;
    const v = p.dataset.modality;
    if(liveState.modalities.has(v)) liveState.modalities.delete(v); else liveState.modalities.add(v);
    p.classList.toggle('on');
    renderLiveBody();
  });
  document.getElementById('passChips').addEventListener('click', e=>{
    const p = e.target.closest('.pill'); if(!p) return;
    const v = p.dataset.pass;
    if(liveState.passes.has(v)) liveState.passes.delete(v); else liveState.passes.add(v);
    p.classList.toggle('on');
    renderLiveBody();
  });
  document.getElementById('roomTabs').addEventListener('click', e=>{
    const b = e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('#roomTabs .tab').forEach(t=>t.classList.toggle('active', t===b));
    liveState.tab = b.dataset.room;
    renderLiveBody();
  });

  renderLiveBody();

function onLiveFilterChange(){
  liveState.filters.date = document.getElementById('fDate').value;
  liveState.filters.qtc = document.getElementById('fQtc').value;
  liveState.filters.labeler = document.getElementById('fLabeler').value;
  liveState.filters.device = document.getElementById('fDevice').value;
  liveState.filters.queue = document.getElementById('fQueue').value;
  renderLiveBody();
}
function clearLiveFilters(){
  liveState = { shifts:new Set(), modalities:new Set(), passes:new Set(), tab:'all', search:'', filters:{ date:'', qtc:'', labeler:'', device:'', queue:'' } };
  renderLiveShell();
}

function getFilteredLiveRows(){
  const si = liveData.slicerIndices;
  const tsIdx = liveData.tsIdx;
  let rows = liveData.rows;
  if(liveState.shifts.size > 0) rows = rows.filter(r=>liveState.shifts.has(r[si['Shift']]));
  if(liveState.modalities.size > 0) rows = rows.filter(r=>liveState.modalities.has(r[si['Modality']]));
  if(liveState.passes.size > 0) rows = rows.filter(r=>liveState.passes.has(r[si['Pass']]));
  if(liveState.filters.date) rows = rows.filter(r=> String(r[tsIdx]||'').startsWith(liveState.filters.date));
  if(liveState.filters.qtc) rows = rows.filter(r=>r[si['Qtc Name']]===liveState.filters.qtc);
  if(liveState.filters.labeler) rows = rows.filter(r=>r[si['Labeler Name']]===liveState.filters.labeler);
  if(liveState.filters.device) rows = rows.filter(r=>r[si['Pc No']]===liveState.filters.device);
  if(liveState.filters.queue) rows = rows.filter(r=>r[si['Queue Name']]===liveState.filters.queue);
  if(liveState.tab && liveState.tab !== 'all' && liveState.tab !== '__total__' && liveState.tab !== '__top__' && liveData.locationColIdx >= 0){
    rows = rows.filter(r=>r[liveData.locationColIdx]===liveState.tab);
  }
  if(liveState.search) rows = rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(liveState.search)));
  return rows;
}

function renderActiveTags(){
  const tags = [];
  if(liveState.search) tags.push(['Search: '+liveState.search, ()=>{liveState.search=''; renderLiveShell();}]);
  liveState.shifts.forEach(s=>tags.push(['Shift: '+s, ()=>{liveState.shifts.delete(s); renderLiveShell();}]));
  liveState.modalities.forEach(s=>tags.push(['Modality: '+s, ()=>{liveState.modalities.delete(s); renderLiveShell();}]));
  liveState.passes.forEach(s=>tags.push(['Pass: '+s, ()=>{liveState.passes.delete(s); renderLiveShell();}]));
  Object.entries(liveState.filters).forEach(([k,v])=>{ if(v) tags.push([k+': '+v, ()=>{liveState.filters[k]=''; renderLiveShell();}]); });
  const box = document.getElementById('activeTags');
  if(!box) return;
  if(tags.length===0){ box.innerHTML=''; return; }
  box.innerHTML = tags.map((t,i)=>`<span class="tag">${esc(t[0])} <button onclick="window.__tagRemove${i}()">✕</button></span>`).join('');
  tags.forEach((t,i)=>{ window['__tagRemove'+i] = t[1]; });
}

function renderLiveBody(){
  renderActiveTags();
  const rows = getFilteredLiveRows();
  const si = liveData.slicerIndices;
  const body = document.getElementById('liveBody');

  if(liveState.tab === '__total__'){ body.innerHTML = renderTotalSubmitView(rows, si); return; }
  if(liveState.tab === '__top__'){ body.innerHTML = renderTopPerformersView(rows, si); return; }

  const uniq = (idx) => new Set(rows.map(r=>r[idx]).filter(Boolean)).size;
  const devices = {};
  rows.forEach(r=>{
    const d = r[si['Pc No']]; if(!d) return;
    if(!devices[d]) devices[d] = { count:0, labeler:r[si['Labeler Name']], email:r[si['Yubikey Email']], queues:{} };
    devices[d].count++;
    const q = r[si['Queue Name']];
    devices[d].queues[q] = (devices[d].queues[q]||0)+1;
  });

  const queueTotals = {};
  rows.forEach(r=>{
    const q = r[si['Queue Name']] || '—';
    const mod = r[si['Modality']] || '—';
    const pass = r[si['Pass']] || '—';
    queueTotals[q] = queueTotals[q] || {};
    const key = mod+'|'+pass;
    queueTotals[q][key] = (queueTotals[q][key]||0)+1;
  });

  const modCounts = {}, passCounts = {};
  rows.forEach(r=>{
    const m = r[si['Modality']] || '—'; modCounts[m] = (modCounts[m]||0)+1;
    const p = r[si['Pass']] || '—'; passCounts[p] = (passCounts[p]||0)+1;
  });

  body.innerHTML = `
    <div class="stat-row">
      <div class="stat"><b>${rows.length}</b><span>TOTAL ROWS</span></div>
      <div class="stat"><b>${uniq(si['Pc No'])}</b><span>DEVICES</span></div>
      <div class="stat"><b>${uniq(si['Queue Name'])}</b><span>QUEUES</span></div>
      <div class="stat"><b>${uniq(si['Labeler Name'])}</b><span>LABELERS</span></div>
    </div>
    <div class="stat-row">
      ${Object.entries(modCounts).map(([k,n])=>`<div class="stat"><b>${n}</b><span>🔬 ${esc(k).toUpperCase()}</span></div>`).join('')}
      ${Object.entries(passCounts).map(([k,n])=>`<div class="stat"><b>${n}</b><span>✅ ${esc(k).toUpperCase()}</span></div>`).join('')}
    </div>

    <div class="panel"><div class="panel-head"><h3>🖥️ Device Submit Counts</h3><span>${Object.keys(devices).length} devices</span></div>
    <div class="panel-body"><div class="grid-cards">
      ${Object.entries(devices).map(([d,info])=>`
        <div class="card">
          <div style="display:flex;justify-content:space-between"><b>${esc(d)}</b><span class="badge">${info.count}</span></div>
          <div style="font-size:11.5px;margin-top:4px">👤 ${esc(info.labeler)}</div>
          <div style="font-size:10.5px;color:var(--ink-soft)">✉️ ${esc(info.email)}</div>
        </div>`).join('') || '<span style="color:var(--ink-soft)">No devices</span>'}
    </div></div></div>

    <div class="panel"><div class="panel-head"><h3>📁 Queue — Total Submits</h3><span>${Object.keys(queueTotals).length} queues</span></div>
    <div class="panel-body table-wrap"><table>
      <thead><tr><th>Queue</th><th>Modality</th><th>Pass</th><th>Count</th></tr></thead>
      <tbody>${Object.entries(queueTotals).flatMap(([q,combos])=>Object.entries(combos).map(([k,n])=>{
        const [mod,pass]=k.split('|');
        return `<tr><td>${esc(q)}</td><td>${esc(mod)}</td><td>${esc(pass)}</td><td><b>${n}</b></td></tr>`;
      })).join('') || '<tr><td colspan="4">No data</td></tr>'}</tbody>
    </table></div></div>

    <div class="panel"><div class="panel-head"><h3>📋 Row Detail</h3><span>${rows.length} rows (showing up to 300)</span></div>
    <div class="panel-body">
      <div class="table-wrap"><table><thead><tr>${liveData.headers.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead>
      <tbody>${rows.slice(0,300).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
    </div></div>`;
}

function groupCount(rows, idx){
  const m = {};
  rows.forEach(r=>{ const k = r[idx] || '—'; m[k] = (m[k]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function renderTotalSubmitView(rows, si){
  const groups = [
    ['👤 By Labeler', si['Labeler Name']],
    ['🔖 By QC', si['Qtc Name']],
    ['📍 By Room', liveData.locationColIdx],
    ['⏱ By Shift', si['Shift']],
    ['📁 By Queue', si['Queue Name']]
  ];

    if(idx===undefined || idx<0) return '';
    const data = (idx===si['Shift']) ? groupCountFn(rows, r=>normShift(r[idx])) : groupCount(rows, idx);

let fastRange = { from:null, to:null }, fastReq = 0;
function renderFastForm(){
  const el = document.getElementById('view-fast');
  el.innerHTML = `
    <div class="panel"><div class="panel-head"><h3>⚡ Fast Submits Audit</h3></div>
    <div class="panel-body">
      <div class="filters" id="fastPresets">
        <button class="pill on" data-preset="24h">🕐 Last 24h</button>
        <button class="pill" data-preset="today">📆 Today</button>
        <button class="pill" data-preset="yesterday">📅 Yesterday</button>
        <button class="pill" data-preset="7d">🗓️ Last 7 Days</button>
        <button class="pill" data-preset="custom">🛠️ Custom Range</button>
      </div>
      <div class="filters" id="fastCustomRange" style="display:none">
        <label>From:</label><input type="datetime-local" id="fastFrom">
        <label>To:</label><input type="datetime-local" id="fastTo">
      </div>
      <div id="fastResults"></div>
    </div></div>`;
  function setPreset(p){
    const now = new Date(); let from, to = now;
    if(p==='24h') from = new Date(now.getTime()-86400000);
    else if(p==='today'){ from = new Date(now); from.setHours(0,0,0,0); }
    else if(p==='yesterday'){ to = new Date(now); to.setHours(0,0,0,0); from = new Date(to.getTime()-86400000); }
    else if(p==='7d') from = new Date(now.getTime()-7*86400000);
    fastRange = { from, to };
  }
  document.getElementById('fastPresets').addEventListener('click', e=>{
    const b = e.target.closest('.pill'); if(!b) return;
    document.querySelectorAll('#fastPresets .pill').forEach(p=>p.classList.toggle('on', p===b));
    const preset = b.dataset.preset;
    document.getElementById('fastCustomRange').style.display = preset==='custom' ? 'flex' : 'none';
    if(preset !== 'custom'){ setPreset(preset); runFastAudit(); }
  });
  const auto = debounce(runFastAudit, 700);
  document.getElementById('fastFrom').onchange = auto;
  document.getElementById('fastTo').onchange = auto;
  setPreset('24h'); runFastAudit();
}
function runFastAudit(){
  let from, to;
  const custom = document.getElementById('fastCustomRange').style.display !== 'none';
  if(custom){
    from = document.getElementById('fastFrom').value; to = document.getElementById('fastTo').value;
    if(!from || !to) return;
  } else { from = fastRange.from.toISOString(); to = fastRange.to.toISOString(); }
  const my = ++fastReq;
  document.getElementById('fastResults').innerHTML = '<div class="loading">⏳ Scanning (this may take a bit for large sheets)…</div>';
  google.script.run
    .withFailureHandler(e=>{ if(my!==fastReq) return; document.getElementById('fastResults').innerHTML = errBox(e.message, 'runFastAudit'); })
    .withSuccessHandler(res=>{
      if(my!==fastReq) return;
      if(res.error){ document.getElementById('fastResults').innerHTML = errBox(res.error, 'runFastAudit'); return; }
      renderFastResults(res);
    }).getFastSubmitsAudit(from, to);
}
function renderFastResults(res){
  const sections = [
    ['labelerLane','👤 Labeler — Lane Line (< 10 min)'], ['labelerLidar','👤 Labeler — Lidar (< 10 min)'],
    ['qcLane','🔖 QC — Lane Line (< 5 min)'], ['qcLidar','🔖 QC — Lidar (< 5 min)']
  ];
  document.getElementById('fastResults').innerHTML = sections.map(([key,title])=>{
    const groups = res[key]||[];
    if(groups.length===0) return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span>0</span></div></div>`;
    const body = groups.map(g=>`
      <div style="margin-bottom:10px">
        <div style="font-weight:700;background:var(--chip);padding:6px 10px;border-radius:6px">${esc(g.name)} — Queue: ${esc(g.queueName)} (${g.count} rows)</div>
        <div class="table-wrap"><table><thead><tr><th>Time</th><th>Unit</th><th>Shift</th><th>Pass</th><th>Diff</th></tr></thead>
        <tbody>${g.rows.map(r=>`<tr><td>${esc(r.timeFormatted)}</td><td>${esc(r.unit)}</td><td>${esc(r.shift)}</td><td class="pass">${esc(r.pass)}</td><td class="${r.diff!=='Base Task'?'diffbad':''}">${esc(r.diff)}</td></tr>`).join('')}</tbody></table></div>
      </div>`).join('');
    return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span>${groups.reduce((s,g)=>s+g.count,0)} violations</span></div><div class="panel-body">${body}</div></div>`;
  }).join('');
}

      if(res.error){ document.getElementById('teamsResults').innerHTML = errBox(res.error, 'runTeamsSubmission'); return; }
      const sum = (a,k)=>a.reduce((s,r)=>s+(Number(r[k])||0),0);
      const T = res.teamRows, I = res.individualRows;
      document.getElementById('teamsResults').innerHTML = `
        <div class="panel"><div class="panel-head"><h3>🔖 Team Daily Submission — ${esc(res.shift)} · ${esc(res.date)}</h3></div><div class="panel-body">
        <div class="table-wrap"><table><thead><tr><th>QC</th><th>Team Daily Submission</th><th>Submitted by QTC</th><th>Submitted by External QTC</th><th>External QTCs Names</th></tr></thead>
        <tbody>${T.map(r=>`<tr class="${r.kind==='special'?'special':''}"><td>${esc(r.qtc)}</td><td><b>${r.total}</b></td><td>${r.own}</td><td>${r.ext}</td><td style="white-space:normal">${esc(r.extNames)}</td></tr>`).join('') || '<tr><td colspan="5">No data</td></tr>'}
        ${T.length?`<tr class="total"><td>TOTAL</td><td>${sum(T,'total')}</td><td>${sum(T,'own')}</td><td>${sum(T,'ext')}</td><td></td></tr>`:''}</tbody></table></div>
        </div></div>
        <div class="panel"><div class="panel-head"><h3>👤 Everyone Who Reviewed</h3></div><div class="panel-body">
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>FP Lidar</th><th>QA Lidar</th><th>FP Lane</th><th>QA Lane</th><th>Total</th></tr></thead>
        <tbody>${I.map(r=>`<tr><td>${esc(r.displayName)}</td><td>${r.fpLidar}</td><td>${r.qaLidar}</td><td>${r.fpLaneLine}</td><td>${r.qaLaneLine}</td><td><b>${r.totalReviewed}</b></td></tr>`).join('') || '<tr><td colspan="6">No data</td></tr>'}
        ${I.length?`<tr class="total"><td>TOTAL</td><td>${sum(I,'fpLidar')}</td><td>${sum(I,'qaLidar')}</td><td>${sum(I,'fpLaneLine')}</td><td>${sum(I,'qaLaneLine')}</td><td>${sum(I,'totalReviewed')}</td></tr>`:''}</tbody></table></div>
        </div></div>`;
    }).getTeamsSubmission(date, teamsSt.shift);
}

// ---------- access gate + boot ----------
function gateMsg(m){ document.getElementById('gateMsg').textContent = m; }
function bootApp(u){
  document.getElementById('userChip').textContent = '👤 ' + u.name + (u.position ? ' — ' + u.position : '');
  document.getElementById('gate').classList.add('hide');
  loadTab('live');
}
google.script.run
  .withFailureHandler(e=>gateMsg('⚠️ '+e.message))
  .withSuccessHandler(u=>{ if(u && u.ok) bootApp(u); else gateMsg('🔒 '+((u&&u.msg)||'Access denied')+(u&&u.email?'\n'+u.email:'')); })
  .checkAccess();
</script>
