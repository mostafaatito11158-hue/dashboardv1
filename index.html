<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEG Productivity</title>
<style>
:root{
  --bg:#e9efff; --panel:rgba(255,255,255,.62); --line:rgba(15,23,42,.12); --ink:#0f172a; --ink-soft:#475569;
  --chip:rgba(255,255,255,.6); --chip-line:rgba(15,23,42,.14); --acc:#6366f1; --on-acc:#fff; --pop:#fff; --hi:rgba(255,255,255,.9);
  --good:#047857; --bad:#be123c; --m:#b45309; --n:#1d4ed8; --on:#6d28d9;
  --back:radial-gradient(circle at 10% 15%,rgba(99,102,241,.28),transparent 42%),radial-gradient(circle at 90% 80%,rgba(244,114,182,.3),transparent 46%),linear-gradient(135deg,#dbeafe,#e0f2fe);
}
[data-theme="dark"]{
  --bg:#1b1147; --panel:rgba(255,255,255,.12); --line:rgba(255,255,255,.25); --ink:#fff; --ink-soft:rgba(255,255,255,.75);
  --chip:rgba(255,255,255,.08); --chip-line:rgba(255,255,255,.22); --acc:#67e8f9; --on-acc:#06222b; --pop:#26305a; --hi:rgba(255,255,255,.25);
  --good:#6ee7b7; --bad:#fda4af; --m:#fde047; --n:#67e8f9; --on:#f9a8d4;
  --back:radial-gradient(circle at 12% 18%,rgba(255,64,200,.38),transparent 42%),radial-gradient(circle at 88% 72%,rgba(0,200,255,.38),transparent 46%),linear-gradient(135deg,#1b1147,#0b3b5c);
}
*{box-sizing:border-box}
body{margin:0;background:var(--back);background-attachment:fixed;background-color:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;min-height:100vh}
.header,.tabs,.panel,.stat{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.header{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{margin:0;font-size:18px}.header .meta{font-size:11px;color:var(--ink-soft)}
.btn{border:1px solid var(--chip-line);border-radius:16px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn.dark{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn:active{transform:scale(.96)}
.chip-user{font-size:11px;padding:6px 12px;border-radius:14px;border:1px solid var(--chip-line);background:var(--chip)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--chip-line);background:var(--chip);border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-soft)}
.tab.active,.pill.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 40px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);border-radius:12px;margin-bottom:14px;position:relative}
.panel.ss-open{z-index:50}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.panel-head h3{margin:0;font-size:14px}.panel-body{padding:14px 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input{padding:6px 10px;border-radius:8px;border:1px solid var(--chip-line);font-size:12px;background:var(--chip);color:var(--ink)}
select option{background:var(--pop);color:var(--ink)}
.filters label{font-size:11px;font-weight:700;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:var(--pop);text-align:left;padding:7px 8px;color:var(--ink-soft);font-size:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:var(--chip)}
tr.special td{font-style:italic;background:rgba(251,191,36,.14)}
tr.total td{font-weight:800;background:var(--chip);border-top:2px solid var(--line)}
.table-wrap{overflow:auto;max-height:520px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-align:center;min-width:80px}
.stat b{display:block;font-size:18px;color:var(--acc)}.stat span{font-size:9.5px;color:var(--ink-soft);font-weight:700}
.pill{background:var(--chip);border:1px solid var(--chip-line);border-radius:14px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.badge{background:var(--chip);border:1px solid var(--chip-line);border-radius:8px;padding:2px 8px;font-size:10px;font-weight:700}
.pass{color:var(--good);font-weight:700}.diffbad{color:var(--bad);font-weight:700}
.err{padding:14px;background:rgba(244,63,94,.16);color:var(--bad);border-radius:8px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.err button{margin-top:8px;border:none;background:var(--bad);color:#000;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--chip);border:1px solid var(--chip-line);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.tag button{border:none;background:none;cursor:pointer;color:var(--bad);font-weight:800}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{border:1px solid var(--chip-line);border-radius:10px;padding:10px 12px;background:var(--chip)}
.card b{font-family:monospace}
.rank{font-weight:800;width:22px;display:inline-block}
.totals{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.totals{grid-template-columns:1fr}}
.tt th,.tt td{text-align:center}
.sh-M{color:var(--m);font-weight:800}.sh-N{color:var(--n);font-weight:800}.sh-ON{color:var(--on);font-weight:800}
.acc-v{color:var(--acc);font-weight:800}
.ss{position:relative;display:inline-block}
.ss-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--chip-line);font-size:12px;background:var(--chip);color:var(--ink);cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-pop{display:none;position:absolute;top:34px;left:0;z-index:1000;width:240px;background:var(--pop);border:1px solid var(--acc);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.ss-pop input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);margin-bottom:4px;font-size:12px}
.ss-list{max-height:240px;overflow:auto}
.ss-list div{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink)}
.ss-list div:hover,.ss-list div.on{background:var(--chip-line)}
.ss-list .none{color:var(--ink-soft);cursor:default}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px;color:var(--ink-soft)}
.loading::before{content:"";width:46px;height:46px;border-radius:50%;border:4px solid var(--chip-line);border-top-color:var(--acc);border-right-color:#f472b6;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#gate{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:var(--back);background-color:var(--bg);padding:20px;text-align:center}
#gate.hide{display:none}
.gate-input{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--ink);font-size:14px;margin-bottom:12px;outline:none;transition:.2s}
.gate-input::placeholder{color:var(--ink-soft)}
.gate-input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(103,232,249,.22)}
.gate-input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 100px #26305a inset}
</style>
</head>
<body>
<div id="gate">
  <div class="panel" style="padding:28px 32px;max-width:420px;width:100%">
    <h2 style="margin:0 0 4px">⚡ MEEG Productivity</h2>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 16px">Enter your email to open the dashboard.</p>
    <input id="gateEmail" class="gate-input" type="email" placeholder="you@company.com" autocomplete="off">
    <button class="btn dark" style="width:100%;justify-content:center" onclick="submitGateEmail()">🔓 Enter</button>
    <div id="gateMsg" style="white-space:pre-wrap;margin-top:10px;color:var(--ink-soft);font-size:12.5px"></div>
  </div>
</div>

<div class="header">
  <div><h1>⚡ MEEG Productivity</h1><div class="meta">Unified Dashboard — <span id="updTime">—</span></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="userChip" class="chip-user"></span>
    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    <button class="btn dark" onclick="refreshAll()">🔄 Refresh</button>
  </div>
</div>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="live">📊 Live</button>
  <button class="tab" data-tab="qc">🎯 QC Quality</button>
  <button class="tab" data-tab="teamsq">👥 Teams Quality</button>
  <button class="tab" data-tab="fast">⚡ Fast Submits</button>
  <button class="tab" data-tab="teams">📋 Teams Submission</button>
</div>
<div class="wrap">
  <div id="view-live" class="view"></div>
  <div id="view-qc" class="view" style="display:none"></div>
  <div id="view-teamsq" class="view" style="display:none"></div>
  <div id="view-fast" class="view" style="display:none"></div>
  <div id="view-teams" class="view" style="display:none"></div>
</div>

<script>
// ---------- theme ----------
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t==='dark' ? '☀️ Light' : '🌙 Dark';
  try{ localStorage.setItem('meeg_theme', t); }catch(e){}
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }
(function(){ let s='dark'; try{ s=localStorage.getItem('meeg_theme')||'dark'; }catch(e){} applyTheme(s); })();

// ============================================================
//  API  (⚠️ حط لينك الـ /exec بتاعك هنا)
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbzJSRJAIi0DdGp3P3QEYHwH_lAD94jl-Qa8rgDe1i8-Ac8iJwD_HetxiUmhqpaA9v43jA/exec";
const CFG = { DB:'Data Base', QPT:'Quality Per Task', QPL:'Quality Per Labeler', TEAMS:'Teams', EMPTY:'Empty' };
let CURRENT_EMAIL=''; try{ CURRENT_EMAIL=localStorage.getItem('meeg_email')||''; }catch(e){}

function callApi(action, params){
  const p = new URLSearchParams({ action, email:CURRENT_EMAIL, ...(params||{}) });
  return fetch(API_URL+'?'+p.toString())
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(res=>{ if(res && res.error) throw new Error(res.error); return res; });
}
const SHEETS = {};
function getSheet(name, bg){
  const k = name+(bg?'|bg':'');
  if(SHEETS[k]) return Promise.resolve(SHEETS[k]);
  return callApi('sheet',{ name, bg:bg?1:0 }).then(r=>SHEETS[k]=r);
}
const optSheet = (n)=>getSheet(n).catch(()=>({headers:[],rows:[]}));

// ---------- helpers ----------
function esc(s){ return String(s===undefined||s===null?'':s); }
function fmtPct(v){ return (v===''||v===null||v===undefined||isNaN(v)) ? '-' : (Number(v)<=1 ? (Number(v)*100).toFixed(1)+'%' : Number(v).toFixed(1)); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function errBox(msg, retryFn){ return `<div class="err">⚠️ ${esc(msg)}<br><button onclick="(${retryFn})()">🔁 Retry</button></div>`; }
const LOADING = '<div class="loading">Loading…</div>';
function cmap(h){ const m={}; h.forEach((x,i)=>{ const k=String(x||'').trim().toLowerCase(); if(k) m[k]=i; }); return m; }
function ci(m, names){ for(const n of names){ const k=n.toLowerCase(); if(m[k]!==undefined) return m[k]; } return -1; }
function gc(r,i){ return i>=0 ? r[i] : ''; }
function toNum(v){ if(v===''||v==null) return ''; const n=Number(v); return isNaN(n)?'':n; }
const pad=n=>String(n).padStart(2,'0');

// ---------- الوقت والشيفتات (المصدر الوحيد لقواعد الشيفت) ----------
// Room 108/106/4th: ON 00:00-07:55 | M 08:00-15:55 | N 16:00-23:55
// Room 102:         ON 00:30-08:25 | M 08:30-16:25 | N 16:30-00:25 (اليوم التالي بيتحسب N لليوم السابق)
function parseTS(v){
  if(v===''||v==null) return null;
  const s=String(v).trim(); let y,mo,d,h=0,mi=0,se=0,ap='',m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?)?/i))){
    y=+m[1]; mo=+m[2]; d=+m[3]; h=+(m[4]||0); mi=+(m[5]||0); se=+(m[6]||0); ap=(m[7]||'').toLowerCase();
  } else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(?:(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?)?/i))){
    y=+m[3]; if(+m[1]>12){ d=+m[1]; mo=+m[2]; } else { mo=+m[1]; d=+m[2]; }
    h=+(m[4]||0); mi=+(m[5]||0); se=+(m[6]||0); ap=(m[7]||'').toLowerCase();
  } else return null;
  if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0;
  return { date:y+'-'+pad(mo)+'-'+pad(d), mins:h*60+mi, str:y+'-'+pad(mo)+'-'+pad(d)+' '+pad(h)+':'+pad(mi)+':'+pad(se), ms:new Date(y,mo-1,d,h,mi,se) };
}
function prevDate(ds){ const p=ds.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]-1)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function shiftOf(room, t){
  if(!t) return null;
  let a=t.mins, date=t.date;
  if(/102/.test(String(room||''))){ a-=30; if(a<0){ a+=1440; date=prevDate(date); } }
  return { shift:a<480?'ON':a<960?'M':'N', date };
}
function normShift(s){
  const v=String(s||'').trim().toLowerCase(); if(!v) return '—';
  if(/over\s*night|\(on\)|^on$/.test(v)) return 'ON';
  if(/morning|\(m\)|^m$/.test(v)) return 'M';
  if(/night|\(n\)|^n$/.test(v)) return 'N';
  return String(s).trim();
}
function shiftFromName(name){ const m=String(name||'').match(/(?:^|[^A-Za-z])(ON|M|N)(?:[^A-Za-z]|$)/i); return m?m[1].toUpperCase():''; }
function cleanName(n){ return n ? String(n).replace(/\s*\([^)]*\)/g,'').replace(/\b(qtc|tl|on|m|n)\b/gi,'').replace(/[-_/\\]/g,' ').replace(/\s+/g,' ').trim() : ''; }
function normName(n){ return cleanName(n).toLowerCase(); }
function samePerson(a,b){
  if(!a||!b) return false; if(a===b) return true;
  const w1=a.split(' '), w2=b.split(' ');
  if(w1.length>=2&&w2.length>=2&&w1[0]===w2[0]&&w1[1]===w2[1]) return true;
  return a.indexOf(b)!==-1||b.indexOf(a)!==-1;
}

// ---------- shared UI helpers ----------
function groupCountFn(rows, fn){ const m={}; rows.forEach(r=>{ const k=fn(r)||'—'; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function closeSS(){ document.querySelectorAll('.ss-pop').forEach(p=>p.style.display='none'); document.querySelectorAll('.ss-open').forEach(x=>x.classList.remove('ss-open')); }
document.addEventListener('click', closeSS);
function makeSearchable(sel){
  if(!sel||sel.dataset.ss) return; sel.dataset.ss='1'; sel.style.display='none';
  const wrap=document.createElement('span'); wrap.className='ss';
  const btn=document.createElement('button'); btn.type='button'; btn.className='ss-btn';
  const pop=document.createElement('div'); pop.className='ss-pop';
  const inp=document.createElement('input'); inp.placeholder='🔎 Search…';
  const list=document.createElement('div'); list.className='ss-list';
  pop.append(inp,list); wrap.append(btn,pop); sel.after(wrap);
  const label=()=>{ const o=sel.options[sel.selectedIndex]; btn.textContent=(o?o.text:'')+' ▾'; };
  const pick=o=>{ sel.value=o.value; label(); closeSS(); if(sel.onchange) sel.onchange(); };
  const draw=()=>{
    const q=inp.value.trim().toLowerCase(); list.innerHTML='';
    const m=[...sel.options].filter(o=>o.text.toLowerCase().includes(q)).slice(0,300);
    m.forEach(o=>{ const d=document.createElement('div'); d.textContent=o.text; if(o.value===sel.value) d.className='on'; d.onclick=e=>{ e.stopPropagation(); pick(o); }; list.appendChild(d); });
    if(!m.length){ const d=document.createElement('div'); d.className='none'; d.textContent='No match'; list.appendChild(d); }
    list._first=m[0];
  };
  btn.onclick=e=>{ e.stopPropagation(); const open=pop.style.display==='block'; closeSS(); if(!open){ pop.style.display='block'; const pn=wrap.closest('.panel'); if(pn) pn.classList.add('ss-open'); inp.value=''; draw(); inp.focus(); } };
  inp.oninput=draw; inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{ if(e.key==='Enter'&&list._first) pick(list._first); if(e.key==='Escape') closeSS(); };
  label();
}
function wavg(rows,key){
  let s=0,w=0;
  rows.forEach(r=>{ const v=r[key]; if(v!==''&&v!==null&&v!==undefined&&!isNaN(v)){ const t=r.tasks||1; s+=Number(v)*t; w+=t; } });
  return w?s/w:'';
}
function weekLabel(w){
  if(!w) return '—'; const s=String(w);
  if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return s;
  const d=new Date(s.substring(0,10)+'T00:00:00');
  return isNaN(d)?s:'Week of '+d.getDate()+' '+d.toLocaleString('en',{month:'short'});
}
function uniqVals(rows,k){ return [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort(); }
function qfBar(id, rows, st){
  const opt=a=>a.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  return `<div class="filters" id="${id}"><label>⏱ Shift:</label>${['M','N','ON'].map(s=>`<button class="pill ${st.shift===s?'on':''}" data-s="${s}">${s}</button>`).join('')}
    <select data-k="qtc"><option value="">🔖 All QC</option>${opt(uniqVals(rows,'qtc'))}</select>
    <button class="pill" data-clear="1">✕ Clear</button></div>`;
}
function wireQf(id, st, apply, rerender){
  const bar=document.getElementById(id);
  bar.querySelectorAll('select').forEach(s=>{ s.value=st[s.dataset.k]||''; s.onchange=()=>{ st[s.dataset.k]=s.value; apply(); }; makeSearchable(s); });
  bar.querySelectorAll('.pill[data-s]').forEach(p=>p.onclick=()=>{ st.shift=st.shift===p.dataset.s?'':p.dataset.s; bar.querySelectorAll('.pill[data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===st.shift)); apply(); });
  bar.querySelector('[data-clear]').onclick=()=>{ st.shift=''; st.qtc=''; rerender(); };
}
function totalsHtml(rows, tva){
  const mets=tva?[['artifacts','ARTIFACTS'],['attribute','ATTRIBUTE'],['tva','TVA F1'],['totalAccuracy','TOTAL ACCURACY']]
                :[['artifacts','ARTIFACTS'],['attribute','ATTRIBUTE'],['totalAccuracy','TOTAL ACCURACY']];
  const order={M:1,N:2,ON:3}, by={}, wk={};
  rows.forEach(r=>{ const w=r.week||'—', s=normShift(r.shift);
    (by[w+'||'+s]=by[w+'||'+s]||{w,s,rows:[]}).rows.push(r); (wk[w]=wk[w]||{w,rows:[]}).rows.push(r); });
  const tasks=a=>a.reduce((s,r)=>s+(r.tasks||0),0);
  const cell=(a,k,cls)=>`<td class="${cls||''}">${fmtPct(wavg(a,k))}</td>`;
  const shiftRows=Object.values(by).sort((a,b)=>String(a.w).localeCompare(String(b.w))||((order[a.s]||9)-(order[b.s]||9))).map(g=>
    `<tr><td>${esc(weekLabel(g.w))}</td><td class="sh-${g.s}">${esc(g.s)}</td><td><b>${tasks(g.rows)}</b></td>${mets.map(([k])=>cell(g.rows,k,k==='totalAccuracy'?'sh-'+g.s:'')).join('')}</tr>`).join('');
  const wfRows=Object.values(wk).sort((a,b)=>String(a.w).localeCompare(String(b.w))).map(g=>
    `<tr><td>${esc(weekLabel(g.w))}</td><td><b>${tasks(g.rows)}</b></td>${mets.map(([k])=>cell(g.rows,k,k==='totalAccuracy'?'acc-v':'')).join('')}</tr>`).join('');
  const head=mets.map(([,l])=>`<th>${l}</th>`).join('');
  return `<div class="totals">
    <div class="panel"><div class="panel-head"><h3>📊 Shift</h3></div><div class="panel-body table-wrap"><table class="tt"><thead><tr><th>WEEK</th><th>SHIFT</th><th>NO. TASKS</th>${head}</tr></thead><tbody>${shiftRows||'<tr><td colspan="9">No data</td></tr>'}</tbody></table></div></div>

function loadOwners(teams, empty){
  const map={};
  function load(sh, ykCol, source){
    if(!sh||!sh.rows.length) return;
    const c=cmap(sh.headers), iY=ci(c,[ykCol]), iQ=ci(c,['tl/ qtc','tl/qtc','tl / qtc']), iS=ci(c,['shift']), iP=ci(c,['pc no.','pc no']), iL=ci(c,['location']);
    let cq='', cs='';
    sh.rows.forEach(r=>{
      const q=String(gc(r,iQ)||'').trim(); if(q){ cq=q; cs=shiftFromName(q)||normShift(gc(r,iS)); }
      const m=String(gc(r,iY)||'').trim().match(/\d{6}/);
      if(!m||map[m[0]]) return;
      map[m[0]]={ qtc:cq, shift:cs==='—'?'':cs, pc:String(gc(r,iP)||'').trim(), location:String(gc(r,iL)||'').trim(), source };
    });
  }
  load(teams,'labeler yubikey','Teams'); load(empty,'yubikey','Empty');
  return map;
}

function buildLive(db){
  const H=db.headers, hl=H.map(h=>h.toLowerCase());
  const shiftI=hl.indexOf('shift'); let tsIdx=hl.indexOf('timestamp'); if(tsIdx<0) tsIdx=hl.findIndex(h=>h.includes('date'));
  let loc=hl.indexOf('unit'); if(loc<0) loc=hl.indexOf('location');
  const rows=[];
  db.rows.forEach(r=>{
    if(r.every(c=>c===''||c==null)) return;
    if(shiftI>=0 && !ALL_SHIFTS.includes(String(r[shiftI]||'').trim().toLowerCase())) return;
    const row=r.slice(0,H.length), t=parseTS(row[tsIdx]);
    if(t) row[tsIdx]=t.str;
    const s=t&&shiftOf(loc>=0?row[loc]:'',t);
    row.sh=s?s.shift:normShift(shiftI>=0?row[shiftI]:'');
    rows.push(row);
  });
  const names=["Shift","Unit","Qtc Name","Yubikey Email","Labeler Name","Pc No","Modality","Queue Name","Pass"];
  const si={}, so={};
  names.forEach(n=>{ const i=hl.indexOf(n.toLowerCase()); if(i>=0){ si[n]=i; so[n]=[...new Set(rows.map(r=>String(r[i]||'').trim()).filter(Boolean))].sort(); } });
  so['Shift']=['M','N','ON'];
  so['_dates']=[...new Set(rows.map(r=>tsIdx>=0?String(r[tsIdx]||'').substring(0,10):'').filter(x=>/^\d{4}-/.test(x)))].sort().reverse();
  const locations=loc>=0?[...new Set(rows.map(r=>String(r[loc]||'').trim()).filter(Boolean))].sort():[];
  return { headers:H.map(h=>h||'—'), rows, slicerIndices:si, slicerOptions:so, tsIdx, locationColIdx:loc, locations };
}

let qcRowsData=null, qcWeek='', qcSt={shift:'',qtc:''}, qcView='totals';
function buildQC(qpt, db, teams, empty){
  const q=cmap(qpt.headers), iId=ci(q,['actual id']), iEm=ci(q,['actual email']), iExp=ci(q,['expected date']),
        iArt=ci(q,['artifacts']), iAttr=ci(q,['attribute']), iAcc=ci(q,['total accuracy']);
  const d=cmap(db.headers), iT=ci(d,['task id']), iQ=ci(d,['qtc name']), iTs=ci(d,['timestamp']), iU=ci(d,['unit']), iL=ci(d,['labeler name']), iP=ci(d,['pass']);
  const byTask={};
  db.rows.forEach(r=>{
    const id=String(gc(r,iT)||'').trim(); if(!id) return;
    const isQA=/QA|QUALITY/i.test(String(gc(r,iP)||''));
    if(!byTask[id]||isQA) byTask[id]={ qtc:String(gc(r,iQ)||'').trim(), ts:gc(r,iTs), unit:gc(r,iU), labeler:String(gc(r,iL)||'').trim() };
  });
  const owners=loadOwners(teams,empty); let minExp='';
  const rows=[];
  qpt.rows.forEach(r=>{
    const id=String(gc(r,iId)||'').trim(); if(!id) return;
    const ex=String(gc(r,iExp)||'').substring(0,10); if(ex&&(!minExp||ex<minExp)) minExp=ex;
    const base={ taskId:id, tasks:1, artifacts:toNum(gc(r,iArt)), attribute:toNum(gc(r,iAttr)), totalAccuracy:toNum(gc(r,iAcc)) };
    const t=byTask[id];
    if(t){
      const s=shiftOf(t.unit,parseTS(t.ts));
      rows.push({...base, qtc:cleanName(t.qtc)||'—', shiftN:s?s.shift:(normShift(shiftFromName(t.qtc))||'—'), labeler:t.labeler, source:'Data Base'});
    } else {
      const em=String(gc(r,iEm)||''), m=em.match(/\d{6}/), o=m&&owners[m[0]];
      if(o) rows.push({...base, qtc:cleanName(o.qtc)||'—', shiftN:o.shift||'—', labeler:em, source:'Teams'});
      else rows.push({...base, qtc:'—', shiftN:'—', labeler:em, source:'Unmatched'});
    }
  });
  return { rows, weekTag:minExp };
}

function buildTQ(qpl,teams,empty){

  Promise.all([getSheet(CFG.QPL),optSheet(CFG.TEAMS),optSheet(CFG.EMPTY)])
    .then(([a,b,c])=>{ tqData=buildTQ(a,b,c); renderTeamsQ(); })
    .catch(e=>{ document.getElementById('view-teamsq').innerHTML=errBox(e.message,'loadTeamsQ'); });
}
function renderTeamsQ(){
  const el=document.getElementById('view-teamsq'); tqView='totals';
  el.innerHTML=`<div class="panel"><div class="panel-head"><h3>👥 Teams Quality</h3><span id="tqCount"></span></div><div class="panel-body">
    <div class="filters" id="tqViews"><button class="pill on" data-view="totals">📊 Totals</button><button class="pill" data-view="qc">🔖 Per QC</button><button class="pill" data-view="individual">👤 Individual</button></div>
    ${qfBar('tqBar',tqData,tqSt)}</div></div><div id="tqContent"></div>`;
  document.getElementById('tqViews').onclick=e=>{ const b=e.target.closest('.pill'); if(!b) return; tqView=b.dataset.view;
    el.querySelectorAll('#tqViews .pill').forEach(p=>p.classList.toggle('on',p===b)); renderTeamsQContent(); };
  wireQf('tqBar',tqSt,renderTeamsQContent,renderTeamsQ); renderTeamsQContent();
}
function renderTeamsQContent(){

    box.innerHTML=`<div class="panel"><div class="panel-body table-wrap"><table><thead><tr><th>Week</th><th>QC</th><th>Tasks</th><th>Artifacts</th><th>Attribute</th><th>Total Accuracy</th></tr></thead><tbody>${Object.values(g).sort((a,b)=>(String(a.week)+a.qtc).localeCompare(String(b.week)+b.qtc)).map(x=>`<tr><td>${esc(weekLabel(x.week))}</td><td>${esc(x.qtc)}</td><td>${x.rows.reduce((s,r)=>s+r.tasks,0)}</td><td>${fmtPct(wavg(x.rows,'artifacts'))}</td><td>${fmtPct(wavg(x.rows,'attribute'))}</td><td>${fmtPct(wavg(x.rows,'totalAccuracy'))}</td></tr>`).join('')||'<tr><td colspan="6">No data</td></tr>'}</tbody></table></div></div>`; return;
  }
  box.innerHTML=totalsHtml(rows.map(r=>({...r,shift:r.shiftN})),false);

// ============================================================
//  FAST SUBMITS — الشيفت بيتحسب بالوقت حسب الروم
// ============================================================
let fastRange={from:null,to:null}, fastReq=0, fastShift='';
function renderFastForm(){
  const el=document.getElementById('view-fast');
  el.innerHTML=`<div class="panel"><div class="panel-head"><h3>⚡ Fast Submits Audit</h3></div><div class="panel-body">
    <div class="filters" id="fastPresets"><button class="pill on" data-preset="24h">🕐 Last 24h</button><button class="pill" data-preset="today">📆 Today</button><button class="pill" data-preset="yesterday">📅 Yesterday</button><button class="pill" data-preset="7d">🗓️ Last 7 Days</button><button class="pill" data-preset="custom">🛠️ Custom Range</button></div>
    <div class="filters" id="fastCustomRange" style="display:none"><label>From:</label><input type="datetime-local" id="fastFrom"><label>To:</label><input type="datetime-local" id="fastTo"></div>
    <div class="filters" id="fastShifts"><label>⏱ Shift:</label>${['','M','N','ON'].map(s=>`<button class="pill ${s===fastShift?'on':''}" data-fs="${s}">${s||'All'}</button>`).join('')}</div>
    <div id="fastResults"></div></div></div>`;
  const setPreset=p=>{ const now=new Date(); let from,to=now;
    if(p==='24h') from=new Date(now-86400000);
    else if(p==='today'){ from=new Date(now); from.setHours(0,0,0,0); }
    else if(p==='yesterday'){ to=new Date(now); to.setHours(0,0,0,0); from=new Date(to-86400000); }
    else if(p==='7d') from=new Date(now-7*86400000);
    fastRange={from,to}; };
  document.getElementById('fastPresets').addEventListener('click',e=>{ const b=e.target.closest('.pill'); if(!b) return;
    document.querySelectorAll('#fastPresets .pill').forEach(p=>p.classList.toggle('on',p===b));
    const p=b.dataset.preset; document.getElementById('fastCustomRange').style.display=p==='custom'?'flex':'none';
    if(p!=='custom'){ setPreset(p); runFastAudit(); } });
  document.getElementById('fastShifts').onclick=e=>{ const b=e.target.closest('.pill'); if(!b) return; fastShift=b.dataset.fs;
    document.querySelectorAll('#fastShifts .pill').forEach(p=>p.classList.toggle('on',p===b)); runFastAudit(); };
  const auto=debounce(runFastAudit,700); document.getElementById('fastFrom').onchange=auto; document.getElementById('fastTo').onchange=auto;
  setPreset('24h'); runFastAudit();
}
function runFastAudit(){
  let from,to;
  if(document.getElementById('fastCustomRange').style.display!=='none'){
    from=new Date(document.getElementById('fastFrom').value); to=new Date(document.getElementById('fastTo').value);
    if(isNaN(from)||isNaN(to)) return;
  } else { from=fastRange.from; to=fastRange.to; }
  const my=++fastReq, box=document.getElementById('fastResults'); box.innerHTML=LOADING;
  getSheet(CFG.DB,true).then(db=>{ if(my!==fastReq) return; renderFastResults(auditFast(db,from,to)); })
    .catch(e=>{ if(my!==fastReq) return; box.innerHTML=errBox(e.message,'runFastAudit'); });
}
function fmtDT(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function auditFast(db,from,to){
  const c=cmap(db.headers), I={ts:ci(c,['timestamp']),unit:ci(c,['unit']),qc:ci(c,['qtc name']),lab:ci(c,['labeler name']),mod:ci(c,['modality']),q:ci(c,['queue name']),link:ci(c,['task link']),pass:ci(c,['pass'])};
  const G={labelerLane:{},labelerLidar:{},qcLane:{},qcLidar:{}};
  db.rows.forEach((r,i)=>{
    if(db.orange&&db.orange[i]) return;
    const pass=String(gc(r,I.pass)||'').toUpperCase(); if(!pass.includes('QA')&&!pass.includes('QUALITY')) return;
    const t=parseTS(gc(r,I.ts)); if(!t||t.ms<from||t.ms>to) return;
    const sh=shiftOf(gc(r,I.unit),t).shift; if(fastShift&&sh!==fastShift) return;
    const lane=/LANE|2D|LINE/i.test(String(gc(r,I.mod)||''));
    const it={ ms:t.ms, shift:sh, unit:String(gc(r,I.unit)||'').trim(), queue:String(gc(r,I.q)||'').trim()||'Default Queue', link:String(gc(r,I.link)||'').trim(), pass };
    const add=(key,name)=>{ if(!name) return; const m=G[key]; ((m[name]=m[name]||{})[it.queue]=m[name][it.queue]||[]).push(it); };
    add(lane?'labelerLane':'labelerLidar',String(gc(r,I.lab)||'').trim()); add(lane?'qcLane':'qcLidar',String(gc(r,I.qc)||'').trim());
  });
  return { labelerLane:auditGroups(G.labelerLane,10), labelerLidar:auditGroups(G.labelerLidar,10), qcLane:auditGroups(G.qcLane,5), qcLidar:auditGroups(G.qcLidar,5) };
}
function auditGroups(grouped,thr){
  const out=[];
  Object.keys(grouped).sort().forEach(name=>Object.keys(grouped[name]).forEach(queue=>{
    const t=grouped[name][queue].slice().sort((a,b)=>a.ms-b.ms), fl=[];
    for(let i=1;i<t.length;i++){
      const p=t[i-1], c=t[i], diff=(c.ms-p.ms)/60000;
      if(diff<thr){ if(!fl.length||fl[fl.length-1].link!==p.link) fl.push({...p,timeFormatted:fmtDT(p.ms),diff:'Base Task'}); fl.push({...c,timeFormatted:fmtDT(c.ms),diff:diff.toFixed(1)+' mins'}); }
    }
    if(fl.length) out.push({name,queueName:queue,count:fl.length,rows:fl});
  }));
  return out;
}
function renderFastResults(res){
  const S=[['labelerLane','👤 Labeler — Lane Line (< 10 min)'],['labelerLidar','👤 Labeler — Lidar (< 10 min)'],['qcLane','🔖 QC — Lane Line (< 5 min)'],['qcLidar','🔖 QC — Lidar (< 5 min)']];
  document.getElementById('fastResults').innerHTML=S.map(([k,title])=>{
    const g=res[k]||[]; if(!g.length) return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span>0</span></div></div>`;
    const body=g.map(x=>`<div style="margin-bottom:10px"><div style="font-weight:700;background:var(--chip);padding:6px 10px;border-radius:6px">${esc(x.name)} — Queue: ${esc(x.queueName)} (${x.count} rows)</div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Unit</th><th>Shift</th><th>Pass</th><th>Diff</th></tr></thead><tbody>${x.rows.map(r=>`<tr><td>${esc(r.timeFormatted)}</td><td>${esc(r.unit)}</td><td class="sh-${r.shift}">${esc(r.shift)}</td><td class="pass">${esc(r.pass)}</td><td class="${r.diff!=='Base Task'?'diffbad':''}">${esc(r.diff)}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
    return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span>${g.reduce((s,x)=>s+x.count,0)} violations</span></div><div class="panel-body">${body}</div></div>`;
  }).join('');
}

// ============================================================
//  TEAMS SUBMISSION
// ============================================================
const SPECIAL=['QTC','SV','SL'];
let teamsSt={shift:null}, teamsReq=0;
function extractPc(v){ if(!v) return null; const s=String(v).trim(); for(const p of s.split('-')){ if(/^\d+$/.test(p.trim())) return p.trim(); } const m=s.match(/\b\d+\b/); return m?m[0]:null; }
function roomKey(v){ const s=String(v||'').toLowerCase(); if(s.includes('108')) return 'room108'; if(s.includes('106')) return 'room106'; if(s.includes('102')) return 'room102'; if(s.includes('4th')||s.includes('fourth')) return 'floor4'; return ''; }
function specialLabel(v){ const s=String(v||'').replace(/\s+/g,' ').trim().toUpperCase(); if(!s) return null; for(const t of SPECIAL){ if(new RegExp('(^|[^A-Z])'+t+'([^A-Z]|$)').test(s)) return t; } return /\d/.test(s)?null:s; }
function categorize(mod,pass){ const m=String(mod||'').toUpperCase(), p=String(pass||'').toUpperCase(); const lane=m.includes('LANE')||m.includes('LINE'), qa=p.includes('QA')||p.includes('QQ')||p.includes('SPOT'); return lane?(qa?'qaLaneLine':'fpLaneLine'):(qa?'qaLidar':'fpLidar'); }
const newRow=l=>({rawName:l,total:0,own:0,ext:0,extNames:{}});
function renderTeamsForm(){
  const el=document.getElementById('view-teams'), n=new Date(), today=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
  if(!teamsSt.shift){ const h=n.getHours(); teamsSt.shift=h<8?'ON':(h<16?'M':'N'); }
  el.innerHTML=`<div class="panel"><div class="panel-head"><h3>📋 Teams Submission</h3></div><div class="panel-body">
    <div class="filters"><label>Date:</label><input type="date" id="teamsDate" value="${today}"><label>Shift:</label>${['ON','M','N'].map(s=>`<button class="pill ${teamsSt.shift===s?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
    <div id="teamsResults"></div></div></div>`;
  document.getElementById('teamsDate').onchange=runTeamsSubmission;
  el.querySelectorAll('.pill[data-s]').forEach(b=>b.onclick=()=>{ teamsSt.shift=b.dataset.s; el.querySelectorAll('.pill[data-s]').forEach(x=>x.classList.toggle('on',x===b)); runTeamsSubmission(); });
  runTeamsSubmission();
}
function runTeamsSubmission(){
  const date=document.getElementById('teamsDate').value; if(!date) return;
  const my=++teamsReq, box=document.getElementById('teamsResults'); box.innerHTML=LOADING;
  Promise.all([getSheet(CFG.TEAMS),getSheet(CFG.DB)]).then(([tm,db])=>{
    if(my!==teamsReq) return;
    const res=computeTeams(tm,db,date,teamsSt.shift), sum=(a,k)=>a.reduce((s,r)=>s+(Number(r[k])||0),0), T=res.teamRows, I=res.individualRows;
    box.innerHTML=`
      <div class="panel"><div class="panel-head"><h3>🔖 Team Daily Submission — ${esc(res.shift)} · ${esc(res.date)}</h3></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th>QC</th><th>Team Daily Submission</th><th>Submitted by QTC</th><th>Submitted by External QTC</th><th>External QTCs Names</th></tr></thead>
      <tbody>${T.map(r=>`<tr class="${r.kind==='special'?'special':''}"><td>${esc(r.qtc)}</td><td><b>${r.total}</b></td><td>${r.own}</td><td>${r.ext}</td><td style="white-space:normal">${esc(r.extNames)}</td></tr>`).join('')||'<tr><td colspan="5">No data</td></tr>'}
      ${T.length?`<tr class="total"><td>TOTAL</td><td>${sum(T,'total')}</td><td>${sum(T,'own')}</td><td>${sum(T,'ext')}</td><td></td></tr>`:''}</tbody></table></div></div></div>
      <div class="panel"><div class="panel-head"><h3>👤 Everyone Who Reviewed</h3></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th>Name</th><th>FP Lidar</th><th>QA Lidar</th><th>FP Lane</th><th>QA Lane</th><th>Total</th></tr></thead>
      <tbody>${I.map(r=>`<tr><td>${esc(r.displayName)}</td><td>${r.fpLidar}</td><td>${r.qaLidar}</td><td>${r.fpLaneLine}</td><td>${r.qaLaneLine}</td><td><b>${r.totalReviewed}</b></td></tr>`).join('')||'<tr><td colspan="6">No data</td></tr>'}
      ${I.length?`<tr class="total"><td>TOTAL</td><td>${sum(I,'fpLidar')}</td><td>${sum(I,'qaLidar')}</td><td>${sum(I,'fpLaneLine')}</td><td>${sum(I,'qaLaneLine')}</td><td>${sum(I,'totalReviewed')}</td></tr>`:''}</tbody></table></div></div></div>`;
  }).catch(e=>{ if(my!==teamsReq) return; box.innerHTML=errBox(e.message,'runTeamsSubmission'); });
}
function computeTeams(tm,db,date,shiftCode){
  const tc=cmap(tm.headers), iP=ci(tc,['pc no.','pc no']), iL=ci(tc,['location']), iQ=ci(tc,['tl/ qtc','tl/qtc','tl / qtc']), iS=ci(tc,['shift']);
  const owners={}, order=[], pcs=[]; let cur=null;
  tm.rows.forEach(r=>{
    const raw=String(gc(r,iQ)||'').trim();
    if(raw){ const key=normName(raw); if(key){ cur=key; if(!owners[key]){ const s=shiftFromName(raw)||normShift(gc(r,iS)); owners[key]={raw,shift:s}; order.push(key); } } }
    const pc=extractPc(gc(r,iP)); if(pc&&cur) pcs.push({key:cur,pc,room:roomKey(gc(r,iL))});
  });
  let keys=order.filter(k=>owners[k].shift===shiftCode); if(!keys.length) keys=order.slice();
  const allowed={}; keys.forEach(k=>allowed[k]=true);
  const pcMap={}; pcs.forEach(p=>{ if(!allowed[p.key]) return; if(p.room) pcMap[p.room+'_'+p.pc]=p.key; pcMap[p.pc]=p.key; });
  const stats={}; keys.forEach(k=>stats[k]=newRow(owners[k].raw));
  const buffer=newRow('Buffer'), special={}, indiv={}; SPECIAL.forEach(t=>special[t]=newRow(t));
  const d=cmap(db.headers), iTs=ci(d,['timestamp']); let iRoom=ci(d,['unit']); if(iRoom<0) iRoom=ci(d,['queue name']);
  const iQtc=ci(d,['qtc name']), iPc=ci(d,['pc no']), iMod=ci(d,['modality']), iPass=ci(d,['pass']);
  db.rows.forEach(row=>{
    const t=parseTS(gc(row,iTs)); if(!t) return;
    const rawRoom=gc(row,iRoom), cls=shiftOf(rawRoom,t);
    if(!cls||cls.shift!==shiftCode||cls.date!==date) return;
    const sub=String(gc(row,iQtc)||'').trim(), rawPc=gc(row,iPc), cs=cleanName(sub);
    if(cs){ const k=normName(cs); const o=indiv[k]=indiv[k]||{displayName:cs,fpLidar:0,qaLidar:0,fpLaneLine:0,qaLaneLine:0,totalReviewed:0}; o[categorize(gc(row,iMod),gc(row,iPass))]++; o.totalReviewed++; }
    const addExt=st=>{ st.ext++; if(cs) st.extNames[cs]=true; };
    if(String(rawPc).toUpperCase().includes('BUFFER')||sub.toUpperCase().includes('BUFFER')){ buffer.total++; if(sub&&!sub.toUpperCase().includes('BUFFER')) addExt(buffer); return; }
    const label=specialLabel(rawPc);
    if(label){ const st=special[label]=special[label]||newRow(label); st.total++; if(sub) addExt(st); return; }
    const pc=extractPc(rawPc); if(!pc) return;
    const ok=pcMap[(roomKey(rawRoom)||'')+'_'+pc]||pcMap[pc];
    if(ok&&stats[ok]){ const st=stats[ok]; st.total++; if(samePerson(normName(sub),ok)) st.own++; else addExt(st); }
  });
  const out=(r,kind)=>({qtc:r.rawName,total:r.total,own:r.own,ext:r.ext,extNames:Object.keys(r.extNames).join(', ')||'-',kind});
  const teamRows=[]; keys.forEach(k=>{ if(stats[k].total>0) teamRows.push(out(stats[k],'qc')); });
  if(buffer.total>0) teamRows.push(out(buffer,'special'));
  SPECIAL.concat(Object.keys(special).filter(l=>!SPECIAL.includes(l)).sort()).forEach(l=>{ if(special[l]&&special[l].total>0) teamRows.push(out(special[l],'special')); });
  return { teamRows, individualRows:Object.values(indiv).sort((a,b)=>b.totalReviewed-a.totalReviewed), shift:shiftCode, date };
}

function gateMsg(m){ document.getElementById('gateMsg').textContent=m; }
function bootApp(u){
  CURRENT_EMAIL=u.email; try{ localStorage.setItem('meeg_email',u.email); }catch(e){}
  document.getElementById('userChip').textContent='👤 '+u.name+(u.position?' — '+u.position:'');
  document.getElementById('gate').classList.add('hide'); loadTab('live');
}
function tryEmail(email){
  gateMsg('Checking…'); CURRENT_EMAIL=email;
  callApi('checkemail',{email}).then(u=>{ if(u&&u.ok) bootApp(u); else gateMsg('🔒 '+((u&&u.msg)||'Access denied')); }).catch(e=>gateMsg('⚠️ '+e.message));
}
function submitGateEmail(){ const e=document.getElementById('gateEmail').value.trim().toLowerCase(); if(!e){ gateMsg('⚠️ Please enter an email'); return; } tryEmail(e); }
document.getElementById('gateEmail').addEventListener('keydown',e=>{ if(e.key==='Enter') submitGateEmail(); });
if(API_URL.indexOf('PASTE_YOUR')===0) gateMsg('⚠️ Developer: set API_URL at the top of the script first.');
else if(CURRENT_EMAIL){ document.getElementById('gateEmail').value=CURRENT_EMAIL; tryEmail(CURRENT_EMAIL); }
